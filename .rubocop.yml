plugins:
 - rubocop-performance
 - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Metrics/AbcSize:
  Max: 25
  
Metrics/BlockLength:
  Max: 36
  Exclude:
    - "*.gemspec"
    - spec/**/*.rb

Metrics/BlockNesting:
  Max: 2

Metrics/ClassLength:
  Max: 150

Metrics/MethodLength:
  Max: 20
  
Layout/DotPosition:
  EnforcedStyle: trailing

Layout/LineLength:
  Max: 120

RSpec/MultipleExpectations:
  Max: 30

RSpec/ExampleLength:
  Max: 100

Style/Documentation:
  Enabled: false