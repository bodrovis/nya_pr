plugins:
 - rubocop-performance

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Metrics/AbcSize:
  Max: 25
  
Metrics/BlockLength:
  Max: 36
  Exclude:
    - "*.gemspec"

Metrics/BlockNesting:
  Max: 2

Metrics/ClassLength:
  Max: 150

Metrics/MethodLength:
  Max: 20
  
Layout/DotPosition:
  EnforcedStyle: trailing

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false