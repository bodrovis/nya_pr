name: CI

on:
  pull_request:

  push:
    branches: [ master ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        ruby:
          - "4.0"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rspec
    # - name: Coveralls
    #   if: matrix.ruby == '4.0'
    #   uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329